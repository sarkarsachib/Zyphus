<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZYPHUS</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<canvas id="mist" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <span class="sigil">Z</span>
    <span class="wordmark">ZYPHUS</span>
    <span class="epithet" id="epithet">adaptive cognitive substrate</span>
  </div>
  <div class="telemetry">
    <span class="t"><i class="dot" id="dot-loop"></i><b id="t-state">—</b></span>
    <span class="t">ticks <b id="t-ticks">—</b></span>
    <span class="t">regime <b id="t-regime">—</b></span>
    <span class="t">queue <b id="t-queue">—</b></span>
    <span class="t">rhythm <b id="t-rhythm">—</b></span>
  </div>
</header>

<main class="stage" id="stage">
  <canvas id="face"></canvas>
  <div class="utterance">
    <span class="mark" aria-hidden="true">▚</span>
    <p id="caption">systems waking…</p>
  </div>
</main>

<section class="console">
  <form id="say" autocomplete="off">
    <span class="prompt" aria-hidden="true">&gt;_</span>
    <input id="say-input" placeholder="speak, or issue a command to zyphus" spellcheck="false">
    <button type="submit" class="btn primary" id="transmit">transmit</button>
    <button type="button" class="btn" id="voice-btn">voice him</button>
  </form>
  <div class="statusline">
    <nav class="tabs" id="tabs">
      <button class="tab" data-panel="tools">tools</button>
      <button class="tab" data-panel="agents">agents</button>
      <button class="tab" data-panel="mind">mind</button>
      <button class="tab" data-panel="body">body</button>
      <button class="tab" data-panel="memory">memory</button>
      <button class="tab" data-panel="key">key</button>
    </nav>
    <span class="hint" id="hint">…</span>
  </div>
  <div class="drawer" id="drawer" hidden></div>
</section>

<audio id="voice-audio" preload="auto"></audio>
<script src="/static/mist.js"></script>
<script src="/static/face.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
