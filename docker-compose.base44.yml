# Development stack for the Zyphus CLI engine.
#
# The engine is a CLI (src/main.py); web/server.py is a dependency-free
# dashboard that drives that CLI so the engine is usable from the browser
# preview on port 3000. Source is bind-mounted, so edits need no rebuild —
# only a change to requirements.txt or Dockerfile.base44 does.

services:
  zyphus:
    build:
      context: .
      dockerfile: Dockerfile.base44
    working_dir: /app
    command: ["sh", "-ec", "exec python -u web/server.py"]
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    environment:
      - BASE44_PREVIEW_MODE
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - ZYPHUS_WEB_PORT=3000
      # Runs the agent loop in the dashboard process; state lives in
      # devmind/agent/agent.db, so a restart resumes where it left off.
      - ZYPHUS_AGENT_AUTOSTART=1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 15s
      retries: 5
      start_period: 30s
    restart: on-failure
